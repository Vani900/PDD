# =============================================================================
# CharityAI – Render Infrastructure Blueprint (render.yaml)
# Managed PostgreSQL 16 + Redis + FastAPI Backend + Next.js Web Frontend
# =============================================================================

services:
  # ── 1. FastAPI Backend Service ──────────────────────────────────────────────
  - type: web
    name: charityai-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: charityai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: charityai-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://charityai-web.onrender.com,http://localhost:3000

  # ── 2. Next.js Web Frontend Service ─────────────────────────────────────────
  - type: web
    name: charityai-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: charityai-api
          property: host
          suffix: /api/v1
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: charityai-api
          property: host
          suffix: /ws

  # ── 3. Managed Redis Service ────────────────────────────────────────────────
  - type: redis
    name: charityai-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

# ── 4. Managed Databases ──────────────────────────────────────────────────────
databases:
  - name: charityai-postgres
    databaseName: charityai
    user: charityai_user
    plan: starter
    region: singapore
    postgresMajorVersion: "16"


