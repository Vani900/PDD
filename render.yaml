# =============================================================================
# CharityAI – Render Infrastructure Blueprint (render.yaml)
# Managed PostgreSQL 16 + Redis + FastAPI Backend + Next.js Web Frontend
# =============================================================================

services:
  # ── 1. FastAPI Backend Service ──────────────────────────────────────────────
  - type: web
    name: charityai-api
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: charityai-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

# ── 2. Managed PostgreSQL Database ───────────────────────────────────────────
databases:
  - name: charityai-postgres
    databaseName: charityai
    user: charityai_user
    plan: free
    region: singapore
    postgresMajorVersion: "16"



