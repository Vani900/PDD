name: CharityAI CI/CD Master Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── 1. Backend Testing & Verification ──────────────────────────────────────
  backend-test:
    name: Backend Pytest & PostgreSQL Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: charityai_test
          POSTGRES_USER: charityai_user
          POSTGRES_PASSWORD: charityai_pass_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry pytest pytest-asyncio pytest-cov httpx asyncpg sqlalchemy alembic pydantic passlib bcrypt python-jose websockets gunicorn uvicorn

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://charityai_user:charityai_pass_2026@localhost:5432/charityai_test
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://charityai_user:charityai_pass_2026@localhost:5432/charityai_test
          PYTHONPATH: .
          SECRET_KEY: ci_secret_key_testing_1234567890_charityai
        run: |
          cd backend
          pytest tests/ --no-cov

  # ── 2. Web Frontend Quality & Build ────────────────────────────────────────
  web-check:
    name: Next.js Frontend Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install Dependencies
        run: |
          cd web
          npm ci

      - name: Run TypeScript Compiler Check
        run: |
          cd web
          npm run type-check

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_API_URL: https://charityai-api.onrender.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://charityai-api.onrender.com/ws
        run: |
          cd web
          npm run build
