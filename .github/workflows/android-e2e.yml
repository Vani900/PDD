name: Android Mobile E2E Appium Test Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BrainBattleAppium/package.json

      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Verifying KVM acceleration availability..."
          sudo apt-get update -qq
          sudo apt-get install -y cpu-checker
          kvm-ok || true
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            echo "KVM acceleration enabled successfully."
          else
            echo "KVM device not present, will fallback to software virtualization."
          fi

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          elif [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            echo "No gradlew found in android/ or root, checking for pre-built APK..."
          fi

      - name: Install Appium & Dependencies
        run: |
          cd BrainBattleAppium
          npm install
          npx appium driver install uiautomator2 || true
          # Make scripts executable
          chmod +x scripts/ci_run_tests.sh

      - name: Run Appium 1,111-Test Suite on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: 'Nexus 6'
          avd-name: 'Android_Nexus6_API29'
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            export APK_PATH="${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk"
            ./BrainBattleAppium/scripts/ci_run_tests.sh

      - name: Ensure Test Reports and Excel Workbook Exist
        if: always()
        run: |
          cd BrainBattleAppium
          if [ ! -f "reports/test-report.xlsx" ]; then
            echo "[CI] Generating fallback Excel report..."
            node utils/generateFallbackReport.js
          fi

      - name: Prepare Report Directories for GitHub Pages
        if: always()
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}

          # Copy generated reports (Excel workbook + HTML report)
          if [ -d "BrainBattleAppium/reports" ]; then
            cp -r BrainBattleAppium/reports/* public/reports/latest/ || true
            cp -r BrainBattleAppium/reports/* public/reports/history/build-${{ github.run_number }}/ || true
          fi

          # Copy index page to root for easy navigation
          if [ -f "public/reports/latest/execution-report.html" ]; then
            cp public/reports/latest/execution-report.html public/index.html
          fi

      - name: Upload Excel Test Report to GitHub Actions Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Excel-Test-Report
          path: BrainBattleAppium/reports/test-report.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Full Test Reports Bundle (Excel, HTML, Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brainbattle-appium-all-reports
          path: |
            BrainBattleAppium/reports/
            BrainBattleAppium/execution-report.html
            BrainBattleAppium/.wdio-results.jsonl
          retention-days: 30

      - name: Deploy Test Reports to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: false
