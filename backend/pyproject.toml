[tool.poetry]
name = "charityai-backend"
version = "1.0.0"
description = "CharityAI Enterprise Backend – AI-Powered Donation Ecosystem"
authors = ["CharityAI Team <dev@charityai.org>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.13"

# ── Web Framework ─────────────────────────────────────────────────────────────
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
gunicorn = "^23.0.0"

# ── Async ─────────────────────────────────────────────────────────────────────
anyio = "^4.4.0"
httpx = "^0.27.0"
aiofiles = "^24.1.0"

# ── Database ──────────────────────────────────────────────────────────────────
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
greenlet = "^3.1.0"

# ── Validation ────────────────────────────────────────────────────────────────
pydantic = {extras = ["email"], version = "^2.9.0"}
pydantic-settings = "^2.5.0"
email-validator = "^2.2.0"
phonenumbers = "^8.13.0"

# ── Authentication & Security ─────────────────────────────────────────────────
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.12"
cryptography = "^43.0.0"
pyotp = "^2.9.0"
qrcode = {extras = ["pil"], version = "^8.0.0"}

# ── OAuth2 ────────────────────────────────────────────────────────────────────
authlib = "^1.3.0"

# ── Cache ─────────────────────────────────────────────────────────────────────
redis = {extras = ["hiredis"], version = "^5.1.0"}
aioredis = "^2.0.0"

# ── Task Queue ────────────────────────────────────────────────────────────────
celery = {extras = ["redis", "librabbitmq"], version = "^5.4.0"}
kombu = "^5.3.0"

# ── Search ────────────────────────────────────────────────────────────────────
elasticsearch = {extras = ["async"], version = "^8.15.0"}

# ── Object Storage ────────────────────────────────────────────────────────────
boto3 = "^1.35.0"
aioboto3 = "^13.1.0"
python-magic = "^0.4.27"
pillow = "^10.4.0"

# ── Email ─────────────────────────────────────────────────────────────────────
sendgrid = "^6.11.0"
aiosmtplib = "^3.0.0"
jinja2 = "^3.1.4"

# ── SMS ───────────────────────────────────────────────────────────────────────
twilio = "^9.3.0"

# ── Push Notifications ────────────────────────────────────────────────────────
firebase-admin = "^6.5.0"

# ── Payments ──────────────────────────────────────────────────────────────────
stripe = "^11.1.0"
razorpay = "^1.4.2"

# ── AI & ML ───────────────────────────────────────────────────────────────────
openai = "^1.51.0"
google-generativeai = "^0.8.0"
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-google-genai = "^2.0.0"
numpy = "^2.1.0"
scikit-learn = "^1.5.0"
sentence-transformers = "^3.1.0"
pytesseract = "^0.3.13"
opencv-python-headless = "^4.10.0"

# ── PDF & Documents ───────────────────────────────────────────────────────────
reportlab = "^4.2.0"
pypdf2 = "^3.0.0"
weasyprint = "^62.3"

# ── Monitoring & Logging ──────────────────────────────────────────────────────
prometheus-fastapi-instrumentator = "^7.0.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.16.0"}
structlog = "^24.4.0"
python-json-logger = "^2.0.7"

# ── WebSockets ────────────────────────────────────────────────────────────────
websockets = "^13.0.0"

# ── Geolocation ───────────────────────────────────────────────────────────────
geopy = "^2.4.0"

# ── Utilities ─────────────────────────────────────────────────────────────────
python-dotenv = "^1.0.1"
pendulum = "^3.0.0"
arrow = "^1.3.0"
shortuuid = "^1.0.13"
ulid-py = "^1.1.0"
pycountry = "^24.6.1"
babel = "^2.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
faker = "^30.3.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
black = "^24.8.0"
isort = "^5.13.0"
pre-commit = "^4.0.0"
bandit = "^1.7.0"
safety = "^3.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 120
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "B024"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html -v"

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 80
