# CharityAI Kubernetes Helm Configuration
global:
  environment: production
  domain: charityai.org

backend:
  replicaCount: 3
  image:
    repository: charityai/backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 1000m
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75

web:
  replicaCount: 2
  image:
    repository: charityai/web
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  auth:
    database: charityai
    username: charityai_admin
  primary:
    resources:
      limits:
        cpu: 2000m
        memory: 4096Mi

redis:
  enabled: true
  architecture: replication
  master:
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
